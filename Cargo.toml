[package]
name = "piratewave-desktop"
version = "0.2.0-beta.10"
edition = "2021"
description = "Native Rust audio mixer, effect graph, and global soundboard"
license = "MIT"

[workspace]
members = ["crates/piratewave-core", "crates/piratewave-test-plugin", "crates/piratewave-vst2-host", "crates/piratewave-vst-bridge", "crates/piratewave-extension-sdk", "crates/piratewave-example-extension", "examples/gain-plugin"]

[dependencies]
piratewave-core = { path = "crates/piratewave-core" }
piratewave-extension-sdk = { path = "crates/piratewave-extension-sdk" }
anyhow = "1"
cpal = "0.15.3"
crossbeam-queue = "0.3"
directories = "6"
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
global-hotkey = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", features = ["mp3", "flac", "wav", "ogg", "vorbis", "pcm"] }
vst3 = "0.3"
libloading = "0.8"
piratewave-vst2-host = { path = "crates/piratewave-vst2-host" }
getrandom = "0.3"
sha2 = "0.10"
hound = "3.5"
arc-swap = "1.7"
rustfft = "6.4.1"
ab_glyph = "0.2"
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.54", features = ["implement", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_Media_Audio", "Win32_Media_MediaFoundation", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_Devices_Properties", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_System_Registry", "Win32_System_Diagnostics_ToolHelp", "Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_IO", "Win32_Security_Authorization", "Win32_Security", "Win32_Storage_FileSystem"] }

[dev-dependencies]
hound = "3.5"

[profile.release]
lto = "thin"
strip = true


[build-dependencies]
winresource = "0.1"

[patch.crates-io]
cpal = { path = "vendor/cpal" }
