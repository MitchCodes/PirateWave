[package]
name = "piratewave-test-plugin"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"
description = "Deterministic VST2/VST3 fixtures for PirateWave host integration checks"

[lib]
crate-type = ["cdylib"]

[dependencies]
vst3 = "0.3"
vst = { version = "0.4", features = ["disable_deprecation_warning"] }
