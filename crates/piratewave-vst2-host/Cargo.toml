[package]
name = "piratewave-vst2-host"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Shared native VST2 adapter and bounded bridge protocol for PirateWave"

[dependencies]
piratewave-core = { path = "../piratewave-core" }
anyhow = "1"
libloading = "0.8"
crossbeam-queue = "0.3"
vst = { version = "0.4", features = ["disable_deprecation_warning"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_System_LibraryLoader", "Win32_System_Com", "Win32_Graphics_Gdi"] }

[dev-dependencies]
serde_json = "1"
