[package]
name = "piratewave-vst-bridge"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Process-isolated x86 VST2 helper for PirateWave"

[dependencies]
piratewave-core = { path = "../piratewave-core" }
piratewave-vst2-host = { path = "../piratewave-vst2-host" }
anyhow = "1"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Com", "Win32_UI_WindowsAndMessaging"] }
